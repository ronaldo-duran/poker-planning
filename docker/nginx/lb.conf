# Docker's internal DNS — re-resolves 'app' every 10 s so newly scaled
# replicas are picked up without reloading the load balancer.
resolver 127.0.0.11 valid=10s ipv6=off;

# Upgrade WebSocket connections; use 'close' for regular HTTP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Using a variable forces per-request DNS resolution via the resolver above,
    # so traffic is automatically distributed to new replicas after scaling.
    set $app_upstream http://app:80;

    location / {
        proxy_pass         $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  $connection_upgrade;
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Long timeouts for WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
